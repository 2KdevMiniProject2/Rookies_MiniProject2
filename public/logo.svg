<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
  <defs>
    <!-- 배경 아이콘 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A30" />
      <stop offset="100%" stop-color="#FF512F" />
    </linearGradient>

    <!-- 크루아상/빵 금빛 그라데이션 -->
    <linearGradient id="breadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="100%" stop-color="#FFE099" />
    </linearGradient>

    <!-- 스파클/하이라이트 그라데이션 -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#FF9F1C" />
    </linearGradient>

    <!-- 그림자 필터 -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF512F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. 심볼 마크 (Icon) -->
  <g filter="url(#softShadow)">
    <!-- 둥근 스퀘어 배경 -->
    <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#bgGrad)" />
    
    <!-- 장식용 부드러운 내부 링 -->
    <rect x="7" y="7" width="50" height="50" rx="15" stroke="white" stroke-width="1.5" stroke-opacity="0.25" />

    <!-- 픽업 & 베이커리 심볼 (크루아상 & 스마일 픽업 곡선) -->
    <!-- 크루아상 중앙 바디 -->
    <path d="M 22 36 C 20 28, 28 20, 38 21 C 45 22, 48 27, 46 33 C 44 38, 36 41, 28 40 C 24 39, 22 38, 22 36 Z" 
          fill="url(#breadGrad)" />

    <!-- 크루아상 겹겹 결 (텍스처 라인) -->
    <path d="M 27 25 C 32 24, 38 27, 39 33" 
          stroke="#FF7A30" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 33 22 C 37 23, 42 26, 42 31" 
          stroke="#FF7A30" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- 따뜻한 김 & 오더 시그널 (스팀 곡선) -->
    <path d="M 29 16 C 30 14, 32 14, 33 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />
    <path d="M 36 17 C 37 15, 39 15, 40 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />

    <!-- 반짝이는 스파클 별 (신선함 & 즐거움) -->
    <path d="M 46 16 L 47.5 19.5 L 51 21 L 47.5 22.5 L 46 26 L 44.5 22.5 L 41 21 L 44.5 19.5 Z" 
          fill="url(#sparkleGrad)" />
  </g>

  <!-- 2. 워드마크 타이포그래피 (Text) -->
  <g transform="translate(70, 0)">
    <!-- 영문 서브 레이블 -->
    <text x="0" y="22" 
          font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" 
          font-weight="800" 
          letter-spacing="2.5" 
          fill="#FF6B35">
      ROOKIES ORDER
    </text>

    <!-- 국문 메인 타이틀 -->
    <text x="0" y="46" 
          font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="22" 
          font-weight="900" 
          letter-spacing="-0.5" 
          fill="#1E293B">
      루키즈 오더
    </text>

    <!-- 액센트 닷 (포인트) -->
    <circle cx="118" cy="42" r="3.5" fill="#FF512F" />
  </g>
</svg>
