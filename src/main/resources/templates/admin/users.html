<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>회원 목록</title></head>
<body style="font-family:sans-serif;">
<div th:replace="~{admin/fragments :: nav}"></div>
<div style="padding:20px">
    <h1>회원 목록 (<span th:text="${page.totalElements}"></span>명)</h1>
    <table border="1" cellpadding="6" style="border-collapse:collapse;width:100%">
        <thead><tr><th>ID</th><th>이메일</th><th>이름</th><th>전화번호</th><th>역할</th></tr></thead>
        <tbody>
        <tr th:each="user : ${page.content}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.phone}"></td>
            <td th:text="${user.role}"></td>
        </tr>
        </tbody>
    </table>
    <div style="margin-top:12px">
        <a th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
           th:href="@{/admin/users(page=${i})}"
           th:text="${i + 1}"
           style="margin-right:8px"></a>
    </div>
</div>
</body>
</html>
